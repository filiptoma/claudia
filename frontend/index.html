<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report non-zero values on
         notched / curved-screen devices (home indicator, status bar). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eebd30" />
    <title>AstroNote</title>
    <!-- Link-preview (Open Graph / Twitter) defaults. The Cloudflare Pages edge function
         (functions/_middleware.js) rewrites the title tags per route for public documents, so a shared
         document link previews with its own page title. These static values are the fallback for every
         other page (and if the function is ever bypassed). -->
    <meta property="og:site_name" content="AstroNote" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AstroNote" />
    <meta property="og:description" content="Collaborative markdown notes." />
    <meta property="og:url" content="https://notes.byastro.dev/" />
    <meta property="og:image" content="https://notes.byastro.dev/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AstroNote" />
    <meta name="twitter:description" content="Collaborative markdown notes." />
    <meta name="twitter:image" content="https://notes.byastro.dev/icon-512.png" />
    <!-- Set theme before first paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('claudia-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.classList.toggle('dark', t === 'dark')
        } catch (e) {
          /* default to light */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
